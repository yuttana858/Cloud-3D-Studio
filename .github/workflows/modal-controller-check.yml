name: Verify private conversion controller
on:
  push:
    branches: [main]
    paths: ['tools/check_conversion_controller.py', '.github/workflows/modal-controller-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'yuttana858/Cloud-3D-Studio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install locked control client
        run: python -m pip install --disable-pip-version-check --require-hashes -r deploy/requirements-bridge.lock
      - name: Verify API and deployed controller without rebuilding CAD workers
        env:
          SUPABASE_URL: https://iesepcoxqochycckbwoh.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONPATH: src
          MODAL_LOGLEVEL: WARNING
        run: python -m tools.check_conversion_controller --run
