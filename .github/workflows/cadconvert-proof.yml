name: Private CadConvert feasibility proof
on:
  push:
    branches: [main]
    paths: ['tools/cadconvert/**', '.github/workflows/cadconvert-proof.yml']
  workflow_dispatch:
    inputs:
      job_id:
        description: Optional retained failed Parasolid job (leave blank for public reference only)
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: modal-production-build
  cancel-in-progress: false
jobs:
  prove:
    if: github.repository == 'yuttana858/Cloud-3D-Studio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Prepare pinned geometry-only public engine
        run: |
          git clone --no-checkout --filter=blob:none https://github.com/omerbasavul/cadconvert.git work/upstream-source
          python -m tools.cadconvert.prepare --source work/upstream-source --work work/cadconvert
          rustup toolchain install 1.91.1 --profile minimal --no-self-update
          rustup target add --toolchain 1.91.1 x86_64-unknown-linux-musl
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y musl-tools
          cargo +1.91.1 build --release --locked --target x86_64-unknown-linux-musl --manifest-path work/cadconvert/runner/Cargo.toml
          install -m 755 work/cadconvert/runner/target/x86_64-unknown-linux-musl/release/auto3d-cadconvert-proof work/cadconvert/proof
      - name: Install locked operator client
        run: python -m pip install --disable-pip-version-check --require-hashes -r deploy/requirements-bridge.lock
      - name: Run bounded SDK-only proof in the existing Modal workspace
        env:
          SUPABASE_URL: https://iesepcoxqochycckbwoh.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PYTHONPATH: src
          MODAL_LOGLEVEL: WARNING
          PROOF_EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PROOF_EVENT" = push ]; then
            python -m tools.cadconvert.operator --run --authorized-request tools/cadconvert/authorized-once.json
          else
            python -m tools.cadconvert.operator --run --github-event
          fi
