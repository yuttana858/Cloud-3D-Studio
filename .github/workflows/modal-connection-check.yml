name: Check Modal connection from Vault

# Manual control-plane verification only: no push/PR trigger, deployment or CAD job.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: Auto3D Vault profile
        type: choice
        required: true
        default: production
        options:
          - production
          - preview

permissions:
  contents: read

concurrency:
  group: modal-vault-check-${{ inputs.profile }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'yuttana858/Cloud-3D-Studio' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check runner's Vault identity
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python3 - <<'PY'
          import os
          if not os.environ.get('SUPABASE_SECRET_KEY'):
              print('::error title=Missing Supabase runner key::Add a Supabase Secret API key (sb_secret_...) as the Repository Actions secret SUPABASE_SECRET_KEY in yuttana858/Cloud-3D-Studio. A JWT signing secret or publishable key will not work. Keep Modal tokens in Vault.')
              raise SystemExit(1)
          print('Runner Vault identity is configured.')
          PY

      - name: Check out trusted main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Install locked Modal client only
        run: python -m pip install --disable-pip-version-check --require-hashes -r deploy/requirements-bridge.lock

      - name: Verify saved deployment pair and target
        env:
          SUPABASE_URL: https://iesepcoxqochycckbwoh.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
          BRIDGE_PROFILE: ${{ inputs.profile }}
          MODAL_LOGLEVEL: WARNING
        run: python deploy/vault_modal.py --profile "$BRIDGE_PROFILE"

      - name: Record successful verification
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Vault retrieval and Modal deployment-token authentication passed.

          The token's actual workspace and available environment match the saved target.

          No app was deployed and no conversion or Modal Function was started.
          EOF
