[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-3d-studio"
version = "0.6.0"
description = "Shared CPU CAD conversion foundation for Auto3D and Cloud 3D Studio"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "parasolid-kit[occt]==0.3.17",
    "cadquery-ocp-novtk==7.9.3.1.1",
    "cadquery-ocp-proxy==7.9.3.1.1",
    "numpy==2.5.5",
    "trimesh==5.2.1",
    "pillow==13.0.0",
]

[project.scripts]
cloud3d = "cloud_3d_studio.cli:main"

[dependency-groups]
dev = ["modal==1.6.4", "ruff==0.17.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
